<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eren Örnek - Game & Cinema Composer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
        body { background-color: #040b16; color: #e2e8f0; font-family: 'Georgia', serif; }
        .glow-text { text-shadow: 0 0 10px rgba(96, 165, 250, 0.5); }
        .glow-box { box-shadow: 0 0 20px rgba(96, 165, 250, 0.15); border: 1px solid rgba(96, 165, 250, 0.3); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-8 relative overflow-hidden">
    <!-- Background effects -->
    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-blue-500 rounded-full mix-blend-multiply filter blur-[128px] opacity-20 animate-pulse"></div>
    
    <header class="text-center mt-12 mb-16 z-10">
        <img id="profil-foto" src="https://placehold.co/150x150/1e3a8a/60A5FA?text=Eren" alt="Eren Örnek" class="w-32 h-32 rounded-full mx-auto mb-6 glow-box object-cover">
        <h1 class="text-5xl font-bold mb-2 text-blue-400 glow-text tracking-wide">Eren Örnek</h1>
        <p class="text-xl text-blue-200 uppercase tracking-[0.3em] text-sm">Game & Film Composer</p>
    </header>

    <main class="w-full max-w-4xl z-10">
        <section id="about" class="mb-16 bg-[#0a1526] p-8 rounded-[2rem] glow-box text-center">
            <h2 class="text-2xl font-semibold mb-4 text-blue-300">Hakkımda</h2>
            <p id="hakkimda-metin" class="text-lg leading-relaxed text-gray-300">
                Oyunlar ve sinema için orkestral müzikler besteliyorum. REAPER ile sinematik atmosferler yaratıyorum. (Bu metin panelden değişecek)
            </p>
        </section>

        <section id="listen" class="mb-16 bg-[#0a1526] p-8 rounded-[2rem] glow-box text-center">
            <h2 class="text-2xl font-semibold mb-6 text-blue-300">Dinle</h2>
            <div id="muzik-kutu" class="w-full max-w-2xl mx-auto rounded-xl overflow-hidden shadow-lg">
                <p class="text-gray-400 py-8">Admin panelinden SoundCloud veya Spotify kodunuzu ekleyin.</p>
            </div>
        </section>
        
        <section id="contact" class="text-center mb-12">
            <h2 class="text-2xl font-semibold mb-6 text-blue-300">İletişim</h2>
            <a href="mailto:contact@erenornek.com" class="inline-block px-8 py-4 bg-blue-900/50 hover:bg-blue-800/70 text-blue-100 rounded-full transition-all duration-300 border border-blue-500/30 hover:border-blue-400 glow-box">
                Birlikte Çalışalım
            </a>
        </section>
    </main>

    <script>
        // Netlify Identity (Admin girişi için)
        if (window.netlifyIdentity) {
            window.netlifyIdentity.on("init", user => {
                if (!user) {
                    window.netlifyIdentity.on("login", () => {
                        document.location.href = "/admin/";
                    });
                }
            });
        }

        // CMS'ten gelen verileri siteye aktarma
        fetch('content/veri.json')
            .then(response => response.json())
            .then(data => {
                if(data.hakkimda) document.getElementById('hakkimda-metin').innerText = data.hakkimda;
                if(data.profil_foto) document.getElementById('profil-foto').src = data.profil_foto;
                if(data.muzik_kodu) document.getElementById('muzik-kutu').innerHTML = data.muzik_kodu;
            })
            .catch(e => console.log('Sistem panel verisini bekliyor...'));
    </script>
</body>
</html>
