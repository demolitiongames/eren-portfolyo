backend:
  name: git-gateway
  branch: main 

media_folder: "images"
public_folder: "images"

collections:
  - name: "portfolio"
    label: "Site İçeriğini Güncelle"
    files:
      - label: "Ana Sayfa Bilgileri"
        name: "homepage"
        file: "content/veri.json"
        fields:
          - {label: "Hakkımda Yazısı", name: "hakkimda", widget: "text"}
          - {label: "Profil Fotoğrafı", name: "profil_foto", widget: "image", required: false}
          - {label: "SoundCloud veya Spotify Embed Kodu", name: "muzik_kodu", widget: "string", required: false}
